apiVersion: apps/v1
kind: Deployment
metadata:
  name: nutrition-postgres
  namespace: nutrition-dev

spec:
  replicas: 1

  selector:
    matchLabels:
      app: nutrition-postgres

  template:
    metadata:
      labels:
        app: nutrition-postgres

    spec:
      containers:
        - name: postgres
          image: postgres:16

          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: nutrition-db-secret
                  key: POSTGRES_USER

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nutrition-db-secret
                  key: POSTGRES_PASSWORD

            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: nutrition-db-secret
                  key: POSTGRES_DB

          ports:
            - containerPort: 5432

---
apiVersion: v1
kind: Service
metadata:
  name: nutrition-postgres
  namespace: nutrition-dev

spec:
  selector:
    app: nutrition-postgres

  ports:
    - port: 5432
      targetPort: 5432